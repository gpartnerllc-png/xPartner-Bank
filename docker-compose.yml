services:
  xpartner:
    build: .
    image: xpartner/bank:1.0.0
    container_name: xpartner-bank
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      DB_PATH: /app/.data/xpartner.db
      DEMO_MODE: 'false'
      SEED_DEMO: 'false'
      XPARTNER_MASTER_KEY: ${XPARTNER_MASTER_KEY:?defina XPARTNER_MASTER_KEY com 32+ caracteres}
      TOKEN_TTL_SECONDS: '3600'
      HMAC_WINDOW_SECONDS: '120'
      RATE_LIMIT_PER_MINUTE: '600'
      FISCAL_UF: ${FISCAL_UF:-SP}
      FISCAL_CUF: ${FISCAL_CUF:-35}
      FISCAL_CMUN: ${FISCAL_CMUN:-3550308}
      FISCAL_AMBIENTE: ${FISCAL_AMBIENTE:-homologacao}
      FISCAL_SERIES: '1'
      FISCAL_REJECTION_PCT: '0'
      FISCAL_LATENCY_MS: '0'
      SETTLEMENT_INTERVAL_MS: '5000'
    volumes:
      - xpartner-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  xpartner-data:
