apiVersion: v1
kind: Namespace
metadata:
  name: xpartner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xpartner-config
  namespace: xpartner
data:
  NODE_ENV: production
  PORT: "8080"
  HOST: 0.0.0.0
  DB_PATH: /app/.data/xpartner.db
  DEMO_MODE: "false"
  SEED_DEMO: "false"
  TOKEN_TTL_SECONDS: "3600"
  HMAC_WINDOW_SECONDS: "120"
  RATE_LIMIT_PER_MINUTE: "600"
  FISCAL_UF: SP
  FISCAL_CUF: "35"
  FISCAL_CMUN: "3550308"
  FISCAL_AMBIENTE: homologacao
  FISCAL_SERIES: "1"
  FISCAL_REJECTION_PCT: "0"
  FISCAL_LATENCY_MS: "0"
  SETTLEMENT_INTERVAL_MS: "5000"
---
# Substitua por External Secrets / Sealed Secrets em produção. Nunca versione o valor real.
apiVersion: v1
kind: Secret
metadata:
  name: xpartner-secrets
  namespace: xpartner
type: Opaque
stringData:
  XPARTNER_MASTER_KEY: "REPLACE_WITH_KMS_32_CHARS_MINIMUM"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xpartner-data
  namespace: xpartner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpartner-bank
  namespace: xpartner
  labels:
    app.kubernetes.io/name: xpartner-bank
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: xpartner-bank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xpartner-bank
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/xpartner/bank:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: xpartner-config
            - secretRef:
                name: xpartner-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/.data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xpartner-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: xpartner-bank
  namespace: xpartner
spec:
  selector:
    app.kubernetes.io/name: xpartner-bank
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xpartner-bank-ingress
  namespace: xpartner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: xpartner-bank
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Ajuste host/TLS conforme o cluster. O dashboard e a API compartilham a mesma porta.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xpartner-bank
  namespace: xpartner
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: bank.xpartner.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xpartner-bank
                port:
                  number: 80
